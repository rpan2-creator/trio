<!doctype html><html><head><style>@font-face{font-family:"Ink Script";src:url(/ink/fonts/chorus.otf)}@font-face{font-family:"Ink Blackletter";src:url(/ink/fonts/fraktur.woff2)}</style></head><body style="margin:0;background:#f3eee4;display:flex;flex-wrap:wrap;gap:6px;padding:6px;width:1500px">
<script src="/ink/designs.js"></script><script>
(async()=>{
const q=new URLSearchParams(location.search);const mode=q.get('mode')||undefined;
await document.fonts.load("40px \"Ink Script\"");await document.fonts.load("40px \"Ink Blackletter\"");for(const d of InkDesigns.LIB){const cv=await InkDesigns.raster(d,360,mode);cv.style.cssText='width:240px;height:240px;object-fit:contain;background:#fff';const w=document.createElement('div');w.style.cssText='font:12px sans-serif;text-align:center';w.append(cv,document.createElement('br'),d.name);document.body.append(w);}
document.body.dataset.done=1;})();
</script></body></html>
